name: Publish Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      kind:
        description: 'What to publish'
        type: choice
        options:
          - pre-release
          - release
        default: pre-release

jobs:
  test:
    uses: './.github/workflows/test.yaml'

  vsix-release:
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job request the identity token the Marketplace exchanges for
      # a publishing credential.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'true'
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          # This repo uses npm; the packageManager field declares yarn, which
          # v5's default cache auto-detects and then fails on (no yarn.lock).
          package-manager-cache: false
      - name: Publish
        run: |
          set -euxo pipefail
          npm ci --loglevel error
          npm run publish-extensions "$PUBLISH_VERSION"
    env:
      CI: true
      # A push to main has no inputs, so it publishes a pre-release.
      PUBLISH_VERSION: ${{ inputs.kind == 'release' && 'patch' || 'pre-release' }}
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
